# Development database only (`make db-up`, from the backend/ folder): PostgreSQL on localhost:5440 for
# `make run`, plus the empty bcom_test / bcom_e2e databases the backend and browser tests use.
# To run the whole app in Docker, use the docker-compose.yml in the repository root instead.
name: bcom-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bcom
      POSTGRES_PASSWORD: bcom
      POSTGRES_DB: bcom
    ports:
      # Published on purpose: this database is for local development. 5440: 5432/5433 are often taken.
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./tests/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcom -d bcom"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
    # Kept from before, so existing development data stays; separate from the root app's bcom_db-data.
    name: bcom-sales-assistant_db-data
