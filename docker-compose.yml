# Local stack: `docker compose up -d db` for development (backend and frontend run on your machine),
# or `docker compose up --build` to run everything in containers.
name: bcom-sales-assistant

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bcom
      POSTGRES_PASSWORD: bcom
      POSTGRES_DB: bcom
    ports:
      # 5440 on the host: 5432/5433 are often taken by other projects.
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcom -d bcom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
