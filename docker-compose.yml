# Local stack.
#   docker compose up -d db       PostgreSQL only (port 5440), for development with `make run` / `npm run dev`
#   docker compose up --build     everything in containers: app on http://localhost:3080, API on :8080
name: bcom-sales-assistant

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bcom
      POSTGRES_PASSWORD: bcom
      POSTGRES_DB: bcom
    ports:
      # 5440 on the host: 5432/5433 are often taken by other projects.
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcom -d bcom"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development  # set to production behind HTTPS
      DATABASE_URL: postgresql+asyncpg://bcom:bcom@db:5432/bcom
      CORS_ORIGINS: http://localhost:3080
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3080:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
