# Frontend: the Next.js app on http://localhost:3080. Run from the frontend/ folder:
#   docker compose up -d --build
# The browser calls the API directly, so the backend can run anywhere (backend/docker-compose.yml by default).
# The API address is fixed when the image is built; to point at another server:
#   BCOM_API_URL=https://api.example.com/api/v1 docker compose up -d --build
name: bcom-frontend

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${BCOM_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3080:3000"
